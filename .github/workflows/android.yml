name: Android

on:
  push:
    branches: [main]
    paths: &paths
      - Android/**
      - .github/workflows/android.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v5

      # `check` includes `apiCheck`, which fails if the public API changed without `apiDump`.
      - name: Unit tests, API check, lint and builds
        run: ./gradlew check :hapticengine:assembleRelease :example:assembleDebug

      # Catches a broken publishing setup before a release does. Unsigned, into the runner's local repository.
      - name: Publish locally
        run: ./gradlew :hapticengine:publishToMavenLocal

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: Android/**/build/reports/

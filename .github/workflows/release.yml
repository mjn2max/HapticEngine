name: Release

# Push a tag such as `1.2.0` (no `v` prefix) to release. The tag is the Swift package version; this workflow
# checks the Android version matches, tests both platforms, publishes the Android library to Maven Central,
# and drafts the GitHub release from CHANGELOG.md.
#
# The tag itself releases the Swift package, so tag only a commit whose CI is green. The GitHub release is
# a draft: publish it once the Maven Central deployment is released at central.sonatype.com, so both
# platforms are announced together.
#
# Repository secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  A user token from central.sonatype.com
#   SIGNING_KEY, SIGNING_KEY_PASSWORD               An ASCII-armored GPG private key and its passphrase

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  # The same checks as the iOS workflow, on the tagged commit, so nothing is published if they fail.
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Unit tests
        run: swift test

      - name: Build library for each platform
        run: |
          for destination in \
            'generic/platform=iOS' \
            'generic/platform=iOS Simulator' \
            'generic/platform=macOS,variant=Mac Catalyst' \
            'generic/platform=tvOS'; do
            xcodebuild build -scheme HapticEngine -destination "$destination" -quiet
          done

  release:
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check versions match the tag and signing is set up
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SIGNING_KEY secret is empty; Maven Central rejects unsigned uploads."
            exit 1
          fi
          android=$(grep '^VERSION_NAME=' Android/gradle.properties | cut -d= -f2)
          if [ "$android" != "$tag" ]; then
            echo "::error::Android/gradle.properties has VERSION_NAME=$android, but the tag is $tag."
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        working-directory: Android
        run: ./gradlew check

      # Uploads to Maven Central as a deployment to review and release at central.sonatype.com.
      - name: Publish to Maven Central
        working-directory: Android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :hapticengine:publishToMavenCentral --no-configuration-cache

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The changelog section for this version, without its heading.
          awk -v tag="$tag" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md --draft

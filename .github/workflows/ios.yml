name: iOS

on:
  push:
    branches: [main]
    paths: &paths
      - Package.swift
      - iOS/**
      # `AndroidParityTests` checks Android's copy of the patterns against these, so a change there runs it too.
      - Android/hapticengine/src/main/kotlin/dev/codepassion/hapticengine/HapticPattern.kt
      - Android/hapticengine/src/main/kotlin/dev/codepassion/hapticengine/HapticPatternData.kt
      - .github/workflows/ios.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Unit tests
        run: swift test

      - name: Build library for each platform
        run: |
          for destination in \
            'generic/platform=iOS' \
            'generic/platform=iOS Simulator' \
            'generic/platform=macOS,variant=Mac Catalyst' \
            'generic/platform=tvOS'; do
            xcodebuild build -scheme HapticEngine -destination "$destination" -quiet
          done

  # The demo app needs Xcode 27, which GitHub only offers on the `xcode-27` preview image for now. Once
  # `macos-latest` includes Xcode 27 as stable, this can move back into `build-and-test`.
  demo:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `latest` includes betas; the preview image only has Xcode 27, which is still a beta.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build demo app
        run: |
          xcodebuild build \
            -project iOS/Example/HapticEngineDemo.xcodeproj \
            -scheme HapticEngineDemo \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

  # The package declares swift-tools-version 6.0, so it must keep building with the oldest Xcode that has it.
  # The demo app needs the latest Xcode and isn't built here.
  oldest-supported-xcode:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Unit tests
        run: swift test

  # Reports public API changes against the latest release. Breaking changes were allowed before 1.0, so
  # against a 0.x release it only reports them; against 1.0 and later, it fails the pull request.
  api-breakage:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compare with the latest release
        run: |
          baseline=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$baseline" ]; then
            echo "No release yet; nothing to compare against."
            exit 0
          fi
          echo "Comparing with $baseline"
          if swift package diagnose-api-breaking-changes "$baseline" --products HapticEngine; then
            exit 0
          fi
          case "$baseline" in
            0.*) echo "::warning::Public API breaks compatibility with $baseline. Allowed before 1.0; note it in CHANGELOG.md." ;;
            *) exit 1 ;;
          esac

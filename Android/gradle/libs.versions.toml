[versions]
# Both modules compile against SDK 36.1 (compileSdk in their build.gradle.kts). The AndroidX versions
# below are the newest that still compile against 36.1; newer releases (Compose UI 1.12, activity 1.13,
# lifecycle 2.11) need compileSdk 37. Dependabot skips AGP minor and major updates; see .github/dependabot.yml.
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
junit = "4.13.2"
annotation = "1.11.0"
iconsExtended = "1.7.8"
binaryCompatibilityValidator = "0.18.2"
asm = "9.10.1"
mavenPublish = "0.37.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
# Frozen at 1.7.8 and no longer in the Compose BOM, but still works with current Compose.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "iconsExtended" }
# Runtime for the API check tasks in hapticengine/build.gradle.kts.
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
kotlinx-binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
